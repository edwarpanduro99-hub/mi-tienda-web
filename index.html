<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUYAI | Tienda Oficial</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Encabezado -->
  <header class="header">
    <div class="header-container">
      <h1 class="logo">SUYAI</h1>
      <p class="tagline">Moda & Estilo Exclusivo</p>
    </div>
  </header>

  <!-- Banner Informativo -->
  <section class="announcement-bar">
    <p>⚡ Envíos a todo el país | Pedidos directos y rápidos por WhatsApp ⚡</p>
  </section>

  <!-- Contenedor Principal -->
  <main class="main-container">
    <h2 class="section-title">Nuestra Colección</h2>
    
    <!-- Filtros de Categorías -->
    <div id="categorias-container" class="categorias-container"></div>

    <!-- Grilla de Productos -->
    <div id="products-grid" class="products-grid">
      <p class="loading-text">Cargando catálogo...</p>
    </div>
  </main>

  <!-- Pie de Página -->
  <footer class="footer">
    <p>© 2026 SUYAI. Todos los derechos reservados.</p>
    <div class="footer-badges">
      <span>🔒 Compra Segura</span>
      <span>📦 Envíos Garantizados</span>
      <span>💬 Atención Inmediata</span>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
